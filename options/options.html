<!DOCTYPE html>
<html lang="en" data-design="modernist">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../lib/theme-boot.js"></script>
  <title>Settings — Focus</title>
  <link rel="icon" type="image/png" href="../icons/icon16.png">
  <link rel="stylesheet" href="../lib/nt-tokens.css">
  <link rel="stylesheet" href="options.css">
</head>
<body data-surface="settings">
  <main class="settings">
    <h1 class="settings-title">Settings</h1>

    <section class="st-section" aria-labelledby="st-todoist-label">
      <div class="st-head">
        <p class="st-label" id="st-todoist-label">Todoist</p>
        <p class="st-saved" id="todoist-saved" aria-live="polite"></p>
      </div>
      <div class="st-row">
        <p class="st-status" id="todoist-status"><span class="st-state">Not connected</span></p>
        <button type="button" class="st-btn" id="todoist-btn">Connect</button>
      </div>
      <p class="st-hint" id="todoist-hint">Connect to show today's and overdue tasks on the new tab.</p>
    </section>

    <section class="st-section" aria-labelledby="st-calendar-label">
      <div class="st-head">
        <p class="st-label" id="st-calendar-label">Google Calendar</p>
        <p class="st-saved" id="calendar-saved" aria-live="polite"></p>
      </div>
      <div class="st-row">
        <p class="st-status" id="calendar-status"><span class="st-state">Not connected</span></p>
        <button type="button" class="st-btn" id="calendar-btn">Connect</button>
      </div>
      <p class="st-hint" id="calendar-hint">Connect to show today's events on the new tab. Opens Google sign-in.</p>
      <fieldset class="st-cals" id="calendar-list" hidden>
        <legend class="st-sub">Calendars shown</legend>
        <div id="calendar-list-items"></div>
      </fieldset>
    </section>

    <section class="st-section" aria-labelledby="st-newtab-label">
      <div class="st-head">
        <p class="st-label" id="st-newtab-label">New tab</p>
        <p class="st-saved" id="newtab-saved" aria-live="polite"></p>
      </div>
      <label class="st-switch-row">
        <span class="st-switch-label">Show tasks</span>
        <input type="checkbox" role="switch" class="st-switch" id="show-tasks">
      </label>
      <label class="st-switch-row">
        <span class="st-switch-label">Show calendar</span>
        <input type="checkbox" role="switch" class="st-switch" id="show-calendar">
      </label>
      <label class="st-switch-row">
        <span class="st-switch-label">Show weather</span>
        <input type="checkbox" role="switch" class="st-switch" id="show-weather">
      </label>
      <div class="st-row">
        <span class="st-switch-label" id="temp-label">Temperature</span>
        <div class="seg" role="group" aria-labelledby="temp-label">
          <button type="button" class="seg-btn" data-unit="C">°C</button>
          <button type="button" class="seg-btn" data-unit="F">°F</button>
        </div>
      </div>
    </section>

    <section class="st-section" aria-labelledby="st-appearance-label">
      <div class="st-head">
        <p class="st-label" id="st-appearance-label">Appearance</p>
        <p class="st-saved" id="appearance-saved" aria-live="polite"></p>
      </div>
      <div class="st-row">
        <span class="st-switch-label" id="theme-label">Theme</span>
        <div class="seg" role="group" aria-labelledby="theme-label">
          <button type="button" class="seg-btn" data-theme-option="system">System</button>
          <button type="button" class="seg-btn" data-theme-option="light">Light</button>
          <button type="button" class="seg-btn" data-theme-option="dark">Dark</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
