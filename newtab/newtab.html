<!DOCTYPE html>
<html lang="en" data-design="modernist">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" type="image/png" href="../icons/icon16.png">
  <link rel="stylesheet" href="newtab.css">
  <link rel="stylesheet" href="../lib/modernist.css">
</head>
<body data-surface="newtab">
  <canvas class="bg-shader" id="bg-ocean" aria-hidden="true"></canvas>
  <canvas class="bg-shader bg-dither" id="bg-dither" aria-hidden="true"></canvas>

  <div class="top-bar" id="newtab-toolbar-root"></div>

  <main class="main">
    <section class="bedtime-reminder hidden" id="bedtime-reminder" aria-live="polite">
      <div class="bedtime-reminder-icon" id="bedtime-reminder-icon"></div>
      <h2 class="bedtime-reminder-title">Time to shut down.</h2>
      <div class="bedtime-reminder-divider"></div>
      <p class="bedtime-reminder-text" id="bedtime-reminder-text"></p>
      <p class="bedtime-reminder-sub" id="bedtime-reminder-sub"></p>
    </section>

    <header class="daily-header">
      <img class="product-mark" src="../icons/icon48.svg" alt="Focus Extension">
    </header>

    <section class="daily-hero" aria-label="Current day">
      <div>
        <div class="clock" id="clock" aria-label="Current time">
          <span class="clock-part">00</span><span class="clock-separator" aria-hidden="true">:</span><span class="clock-part">00</span>
        </div>
        <p class="full-date" id="full-date"></p>
      </div>

      <div class="weather-section" id="weather-section" aria-label="Weather">
        <div class="weather-loading" id="weather-loading"><div class="spinner spinner-sm"></div></div>
        <div class="weather-content hidden" id="weather-content">
          <span class="weather-icon" id="weather-icon" aria-hidden="true"></span>
          <div class="weather-copy">
            <span class="weather-temp" id="weather-temp"></span>
            <span class="weather-desc" id="weather-desc"></span>
            <span class="weather-highlow" id="weather-highlow"></span>
          </div>
        </div>
        <div class="weather-error hidden" id="weather-error"><span id="weather-error-text"></span></div>
      </div>
    </section>

    <section class="daily-brief" aria-label="Daily brief">
      <article class="brief-feature brief-now" id="brief-now">
        <p class="section-eyebrow" id="now-task-label">Current task</p>
        <div id="now-task" class="feature-content"><p class="brief-empty">Loading your day…</p></div>
        <div class="brief-actions">
          <button class="text-action" id="add-task-btn" type="button">Add task</button>
          <button class="text-action" id="view-tasks-btn" type="button">View tasks</button>
        </div>
      </article>

      <article class="brief-feature brief-next" id="brief-next">
        <p class="section-eyebrow">Next</p>
        <div id="next-event" class="feature-content"><p class="brief-empty">Loading your schedule…</p></div>
        <div class="brief-actions">
          <button class="text-action" id="view-schedule-btn" type="button">View schedule</button>
        </div>
      </article>
    </section>

    <section class="daily-previews" aria-label="Task and schedule previews">
      <article class="preview-column" id="tasks-preview">
        <div class="preview-heading">
          <h2>Tasks</h2>
          <button class="quiet-action hidden" id="todos-connect-btn" type="button">Connect Todoist</button>
        </div>
        <p class="integration-status hidden" id="tasks-status" aria-live="polite"></p>
        <ul class="preview-list" id="task-preview-list"></ul>
        <p class="preview-empty hidden" id="task-preview-empty">Your task list is clear.</p>
      </article>

      <article class="preview-column" id="agenda-preview">
        <div class="preview-heading">
          <h2>Agenda</h2>
          <button class="quiet-action hidden" id="calendar-connect-btn" type="button">Connect Calendar</button>
        </div>
        <p class="integration-status hidden" id="calendar-status" aria-live="polite"></p>
        <ul class="preview-list" id="agenda-preview-list"></ul>
        <p class="preview-empty hidden" id="agenda-preview-empty">Your schedule is clear.</p>
      </article>
    </section>
  </main>

  <div class="planner-drawer hidden" id="planner-drawer" aria-hidden="true">
    <div class="planner-drawer-backdrop" id="planner-drawer-backdrop"></div>
    <section class="planner-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="planner-drawer-title">
      <header class="planner-drawer-header">
        <div>
          <p class="section-eyebrow" id="planner-drawer-eyebrow"></p>
          <h2 id="planner-drawer-title"></h2>
        </div>
        <button class="drawer-close" id="planner-drawer-close" type="button" aria-label="Close planner">Close</button>
      </header>
      <div class="planner-drawer-body" id="planner-drawer-body"></div>
    </section>
  </div>

  <div class="settings-modal hidden" id="settings-modal" aria-hidden="true">
    <div class="settings-modal-backdrop" id="settings-modal-backdrop"></div>
    <section class="settings-dialog" id="settings-dialog" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="settings-dialog-header">
        <button class="settings-dialog-close" id="settings-close-btn" type="button" aria-label="Close settings"><span id="settings-close-icon"></span></button>
      </div>
      <div class="settings-content">
        <div class="settings-stack">
          <section class="settings-section settings-section-frame">
            <iframe class="settings-frame" id="settings-frame" title="Focus Extension Settings" loading="lazy" scrolling="no"></iframe>
          </section>
        </div>
      </div>
    </section>
  </div>

  <script src="../lib/icons.js"></script>
  <script src="radix-shell.bundle.js" type="module"></script>
  <script src="newtab.js" type="module"></script>
</body>
</html>
